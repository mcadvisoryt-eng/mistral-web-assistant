name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Raw web search diagnostics
        run: |
          set +e
          URL=$(curl -sS -m 30 "https://raw.githubusercontent.com/mcadvisoryt-eng/mistral-web-assistant/gh-pages/endpoint.txt" | tr -d '\r\n')
          echo "endpoint: $URL"
          TOKEN=$(curl -sS -m 30 -H "Content-Type: application/json" \
            -d '{"email":"joshi@joshi.com","password":"joshi"}' "$URL/api/v1/auths/signin" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          echo "token length: ${#TOKEN}"

          echo "== retrieval config: web/rag keys =="
          curl -sS -m 30 -H "Authorization: Bearer $TOKEN" "$URL/api/v1/retrieval/config" -o /tmp/r.json
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/r.json'))
          web = d.get('web', {})
          keys = {k: v for k, v in web.items() if any(t in k.upper() for t in ('WEB_SEARCH','TAVILY','ENABLE_WEB','BYPASS'))}
          print(json.dumps(keys, indent=1)[:1500])
          PY

          echo "== chat with web_search (raw) =="
          sleep 20
          curl -sS -m 150 -o /tmp/c.json -w "http=%{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"models/gemini-3.6-flash","messages":[{"role":"user","content":"What is today top news in India? Search the web."}],"stream":false,"features":{"web_search":true}}' \
            "$URL/api/chat/completions"
          echo "RAW BODY:"; head -c 1500 /tmp/c.json; echo
          echo "== done =="
