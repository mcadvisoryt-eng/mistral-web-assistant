name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Does Gemini OpenAI-compat support tools?
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          B="https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
          echo "== tool calling test (gemini-3.5-flash-lite) =="
          curl -sS -m 60 -o /tmp/t.json -w "http=%{http_code}\n" \
            -H "Authorization: Bearer $GEMINI_API_KEY" -H "Content-Type: application/json" \
            -d '{"model":"gemini-3.5-flash-lite","messages":[{"role":"user","content":"What is the weather in Delhi right now? You must call the get_weather tool."}],"tools":[{"type":"function","function":{"name":"get_weather","description":"Get the current weather for a city","parameters":{"type":"object","properties":{"city":{"type":"string"}},"required":["city"]}}}],"tool_choice":"auto","stream":false}' \
            "$B"
          head -c 900 /tmp/t.json; echo
          echo "== done =="
