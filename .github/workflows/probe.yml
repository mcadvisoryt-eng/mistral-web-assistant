name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Tool errors gone?
        run: |
          set +e
          URL=$(curl -sS -m 30 "https://raw.githubusercontent.com/mcadvisoryt-eng/mistral-web-assistant/gh-pages/endpoint.txt" | tr -d '\r\n')
          echo "endpoint: $URL"
          TOKEN=$(curl -sS -m 30 -H "Content-Type: application/json" \
            -d '{"email":"joshi@joshi.com","password":"joshi"}' "$URL/api/v1/auths/signin" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          echo "token length: ${#TOKEN}"
          echo "== default model config (should have web_search on) =="
          curl -sS -m 30 -H "Authorization: Bearer $TOKEN" \
            "$URL/api/v1/models/model?id=models/gemini-3.6-flash" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('builtinTools:',json.dumps(d.get('meta',{}).get('builtinTools')));print('caps:',json.dumps(d.get('meta',{}).get('capabilities')))" 2>/dev/null
          echo "== find venice id =="
          VEN=$(curl -sS -m 30 -H "Authorization: Bearer $TOKEN" "$URL/api/models" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);m=[x.get('id') for x in d.get('data',[]) if 'venice' in x.get('id','').lower()];print(m[0] if m else '')")
          echo "venice id: $VEN"
          for M in "huihui_ai/deephermes3-abliterated:8b" "$VEN"; do
            [ -z "$M" ] && continue
            echo "== chat: $M =="
            curl -sS -m 200 -o /tmp/c.json -w "http=%{http_code}\n" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"Say hello in one short sentence.\"}],\"stream\":false}" \
              "$URL/api/chat/completions"
            python3 - <<'PY'
          import json
          raw = open('/tmp/c.json').read()
          try: d = json.loads(raw)
          except Exception: print("  non-json:", raw[:200]); raise SystemExit
          if isinstance(d, list): print("  list:", str(d)[:200]); raise SystemExit
          if d.get('error'): print("  ERROR:", str(d['error'])[:200]); raise SystemExit
          ch = (d.get('choices') or [{}])[0]
          print("  CONTENT:", str(ch.get('message', {}).get('content',''))[:200])
          PY
          done
          echo "== done =="
