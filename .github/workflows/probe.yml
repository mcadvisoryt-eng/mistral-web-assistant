name: probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to probe"
        required: false
        default: "https://south-revenue-tvs-sept.trycloudflare.com"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe as a browser (Cloudflare tunnel)
        env:
          URL: ${{ github.event.inputs.url || 'https://south-revenue-tvs-sept.trycloudflare.com' }}
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          echo "== GET / (browser UA, no bypass header) =="
          curl -sS -m 30 -o /tmp/a.html -w "http=%{http_code} type=%{content_type} size=%{size_download}\n" -A "$UA" "$URL/"
          echo "title: $(grep -oE '<title>[^<]*</title>' /tmp/a.html)"; head -c 160 /tmp/a.html; echo
          echo
          echo "== GET /api/config (browser UA) =="
          curl -sS -m 30 -o /tmp/c.json -w "http=%{http_code} type=%{content_type} size=%{size_download}\n" -A "$UA" -H "Accept: application/json" "$URL/api/config"
          head -c 120 /tmp/c.json; echo
          echo
          echo "== POST /api/v1/auths/signin =="
          curl -sS -m 30 -o /tmp/s.json -w "http=%{http_code}\n" -A "$UA" -H "Content-Type: application/json" \
            -d '{"email":"joshi@joshi.com","password":"joshi"}' "$URL/api/v1/auths/signin"
          TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/s.json')).get('token',''))" 2>/dev/null)
          echo "token length: ${#TOKEN}"
          echo
          echo "== GET /api/models =="
          curl -sS -m 30 -o /tmp/m.json -w "http=%{http_code}\n" -A "$UA" -H "Authorization: Bearer $TOKEN" "$URL/api/models"
          python3 -c "import json;d=json.load(open('/tmp/m.json'));print('model count:',len(d.get('data',[])))" 2>/dev/null || head -c 300 /tmp/m.json
          echo
          echo "== done =="
