name: probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to probe"
        required: false
        default: "https://detest-humongous-brigade.ngrok-free.dev"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cookie + socket.io flow (simulate a browser)
        env:
          URL: ${{ github.event.inputs.url || 'https://detest-humongous-brigade.ngrok-free.dev' }}
        run: |
          set +e
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          echo "== 1) GET / (browser UA) - capture Set-Cookie =="
          curl -sS -m 30 -c /tmp/cj -D /tmp/hd -o /tmp/i.html -A "$UA" "$URL/"
          echo "set-cookie lines:"; grep -i '^set-cookie' /tmp/hd || echo "(none)"
          echo "interstitial body snippet:"; head -c 200 /tmp/i.html; echo
          echo
          echo "== 2) GET /api/config WITH cookie jar (browser UA) =="
          curl -sS -m 30 -b /tmp/cj -o /tmp/c.json -w "http=%{http_code} type=%{content_type} size=%{size_download}\n" -A "$UA" -H "Accept: application/json" "$URL/api/config"
          head -c 200 /tmp/c.json; echo
          echo
          echo "== 3) socket.io polling handshake (skip header) =="
          curl -sS -m 30 -o /tmp/sio.txt -w "http=%{http_code} type=%{content_type} size=%{size_download}\n" -A "$UA" -H "ngrok-skip-browser-warning: 1" "$URL/ws/socket.io/?EIO=4&transport=polling"
          head -c 200 /tmp/sio.txt; echo
          echo
          echo "== done =="
