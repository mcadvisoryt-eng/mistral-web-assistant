name: probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Base URL to probe"
        required: false
        default: "https://detest-humongous-brigade.ngrok-free.dev"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe tunnel and Open WebUI API
        env:
          URL: ${{ github.event.inputs.url || 'https://detest-humongous-brigade.ngrok-free.dev' }}
          EMAIL: joshi@joshi.com
          PASSWORD: joshi
        run: |
          set +e
          echo "### DNS"
          getent hosts "${URL#https://}" || echo "no DNS result"
          echo
          echo "### GET /health"
          curl -sS -m 30 -o /tmp/h.txt -w "http=%{http_code} type=%{content_type} size=%{size_download}\n" \
            -H "ngrok-skip-browser-warning: 1" "$URL/health"
          echo "body:"; head -c 300 /tmp/h.txt; echo
          echo
          echo "### GET / (page title)"
          curl -sS -m 30 -o /tmp/p.html -w "http=%{http_code} type=%{content_type} size=%{size_download}\n" \
            -H "ngrok-skip-browser-warning: 1" "$URL/"
          grep -oE '<title>[^<]*</title>' /tmp/p.html || head -c 200 /tmp/p.html
          echo
          echo "### POST /api/v1/auths/signin"
          curl -sS -m 30 -o /tmp/s.json -w "http=%{http_code}\n" \
            -H "ngrok-skip-browser-warning: 1" -H "Content-Type: application/json" \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" "$URL/api/v1/auths/signin"
          TOKEN=$(python3 -c "import json;print(json.load(open('/tmp/s.json')).get('token',''))" 2>/dev/null)
          echo "token length: ${#TOKEN}"
          head -c 300 /tmp/s.json; echo
          echo
          echo "### GET /api/models"
          curl -sS -m 30 -o /tmp/m.json -w "http=%{http_code}\n" \
            -H "ngrok-skip-browser-warning: 1" -H "Authorization: Bearer $TOKEN" "$URL/api/models"
          python3 -c "import json;d=json.load(open('/tmp/m.json'));print('model count:',len(d.get('data',[])));print([m.get('id') for m in d.get('data',[])][:20])" 2>/dev/null || head -c 500 /tmp/m.json
          echo
          echo "### done"
