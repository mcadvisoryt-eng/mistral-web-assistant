name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Web search actually fires?
        run: |
          set +e
          URL=$(curl -sS -m 30 "https://raw.githubusercontent.com/mcadvisoryt-eng/mistral-web-assistant/gh-pages/endpoint.txt" | tr -d '\r\n')
          echo "endpoint: $URL"
          TOKEN=$(curl -sS -m 30 -H "Content-Type: application/json" \
            -d '{"email":"joshi@joshi.com","password":"joshi"}' "$URL/api/v1/auths/signin" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          echo "token length: ${#TOKEN}"
          for M in models/gemini-3.5-flash models/gemini-3.5-flash-lite; do
            echo "== $M =="
            curl -sS -m 150 -o /tmp/c.json -w "http=%{http_code}\n" \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"Search the web and tell me one current top news headline from India, with its source URL.\"}],\"stream\":false,\"features\":{\"web_search\":true}}" \
              "$URL/api/chat/completions"
            python3 - <<'PY'
          import json
          raw = open('/tmp/c.json').read()
          try:
              d = json.loads(raw)
          except Exception:
              print("  non-json:", raw[:200]); raise SystemExit
          if isinstance(d, list):
              print("  list err:", str(d)[:200]); raise SystemExit
          if d.get('error'):
              print("  ERROR:", str(d['error'])[:160]); raise SystemExit
          ch = (d.get('choices') or [{}])[0]
          print("  CONTENT:", str(ch.get('message', {}).get('content',''))[:400])
          print("  SOURCES:", json.dumps(d.get('sources', []))[:400])
          PY
          done
          echo "== done =="
