name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Which flash models actually respond
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          B="https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
          for M in gemini-flash-latest gemini-flash-lite-latest gemini-3.8-flash gemini-3.7-flash gemini-3.6-flash gemini-3.5-flash gemini-3.5-flash-lite gemini-2.5-flash-lite; do
            code=$(curl -sS -m 45 -o /tmp/o.json -w "%{http_code}" \
              -H "Authorization: Bearer $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d "{\"model\":\"$M\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":5}" "$B")
            note=$(python3 -c "import json;d=json.load(open('/tmp/o.json'));print((d.get('error') or {}).get('message','')[:70]) if isinstance(d,dict) else ''" 2>/dev/null)
            echo "$M -> $code  $note"
          done
          echo "== done =="
