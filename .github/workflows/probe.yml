name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print Open WebUI model ids
        run: |
          set +e
          URL=$(curl -sS -m 30 https://mcadvisoryt-eng.github.io/mistral-web-assistant/ | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | head -1)
          echo "endpoint: $URL"
          TOKEN=$(curl -sS -m 30 -H "Content-Type: application/json" \
            -d '{"email":"joshi@joshi.com","password":"joshi"}' "$URL/api/v1/auths/signin" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          echo "token length: ${#TOKEN}"
          echo "== model ids (flash) =="
          curl -sS -m 30 -H "Authorization: Bearer $TOKEN" "$URL/api/models" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('total:',len(d.get('data',[])));print([m.get('id') for m in d.get('data',[]) if 'flash' in m.get('id','')][:30])"
          echo "== done =="
