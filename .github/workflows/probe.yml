name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Web search via proper chat session
        run: |
          set +e
          URL=$(curl -sS -m 30 "https://raw.githubusercontent.com/mcadvisoryt-eng/mistral-web-assistant/gh-pages/endpoint.txt" | tr -d '\r\n')
          echo "endpoint: $URL"
          TOKEN=$(curl -sS -m 30 -H "Content-Type: application/json" \
            -d '{"email":"joshi@joshi.com","password":"joshi"}' "$URL/api/v1/auths/signin" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          echo "token length: ${#TOKEN}"

          CID=$(curl -sS -m 30 -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{}' "$URL/api/v1/chats/new" | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))" 2>/dev/null)
          echo "chat id: $CID"
          MSGID=$(python3 -c "import uuid;print(uuid.uuid4())")

          echo "== streamed completion with session_id =="
          curl -sS -m 180 -N -o /tmp/s.txt -w "http=%{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"model\":\"models/gemini-3.5-flash-lite\",\"messages\":[{\"role\":\"user\",\"content\":\"Search the web for a current India news headline and give its source URL.\"}],\"stream\":true,\"chat_id\":\"$CID\",\"id\":\"$MSGID\",\"session_id\":\"probe-$MSGID\",\"features\":{\"web_search\":true}}" \
            "$URL/api/chat/completions"
          echo "---- search evidence ----"
          grep -aoE 'search_web|web_search|"sources"|Searching the web|"url":"[^"]{5,80}"' /tmp/s.txt | sort | uniq -c | head -20
          echo "---- tail of stream ----"
          tail -c 700 /tmp/s.txt
          echo
          echo "== done =="
