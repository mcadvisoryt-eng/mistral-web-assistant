name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Web search fires?
        run: |
          set +e
          URL=$(curl -sS -m 30 "https://raw.githubusercontent.com/mcadvisoryt-eng/mistral-web-assistant/gh-pages/endpoint.txt" | tr -d '\r\n')
          echo "endpoint: $URL"
          TOKEN=$(curl -sS -m 30 -H "Content-Type: application/json" \
            -d '{"email":"joshi@joshi.com","password":"joshi"}' "$URL/api/v1/auths/signin" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          echo "token length: ${#TOKEN}"
          echo "== custom model present? =="
          curl -sS -m 30 -H "Authorization: Bearer $TOKEN" "$URL/api/models" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print([m.get('id') for m in d.get('data',[]) if 'gemini-3.5-flash-lite' in m.get('id','')])" 2>/dev/null
          echo "== chat with web_search on (gemini-3.5-flash-lite) =="
          curl -sS -m 150 -o /tmp/c.json -w "http=%{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"models/gemini-3.5-flash-lite","messages":[{"role":"user","content":"Search the web and tell me one current top news headline from India, with its source URL."}],"stream":false,"features":{"web_search":true}}' \
            "$URL/api/chat/completions"
          python3 - <<'PY'
          import json
          raw = open('/tmp/c.json').read()
          try:
              d = json.loads(raw)
          except Exception:
              print("non-json:", raw[:300]); raise SystemExit
          if isinstance(d, list):
              print("list err:", str(d)[:300]); raise SystemExit
          if d.get('error'):
              print("ERROR:", str(d['error'])[:200]); raise SystemExit
          ch = (d.get('choices') or [{}])[0]
          print("CONTENT:", str(ch.get('message', {}).get('content',''))[:600])
          print("SOURCES:", json.dumps(d.get('sources', []))[:600])
          print("KEYS:", list(d.keys()))
          PY
          echo "== done =="
