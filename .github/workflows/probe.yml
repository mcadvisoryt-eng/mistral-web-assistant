name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve endpoint and print model ids
        run: |
          set +e
          echo "== raw fetch =="
          curl -sS -m 30 -o /tmp/e.txt -w "http=%{http_code} size=%{size_download}\n" \
            "https://raw.githubusercontent.com/mcadvisoryt-eng/mistral-web-assistant/gh-pages/endpoint.txt"
          echo "body: [$(cat /tmp/e.txt)]"
          URL=$(tr -d '\r\n' < /tmp/e.txt)
          echo "endpoint: $URL"
          TOKEN=$(curl -sS -m 30 -H "Content-Type: application/json" \
            -d '{"email":"joshi@joshi.com","password":"joshi"}' "$URL/api/v1/auths/signin" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          echo "token length: ${#TOKEN}"
          echo "== model ids containing flash =="
          curl -sS -m 30 -H "Authorization: Bearer $TOKEN" "$URL/api/models" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('total:',len(d.get('data',[])));print([m.get('id') for m in d.get('data',[]) if 'flash' in m.get('id','')][:30])"
          echo "== done =="
