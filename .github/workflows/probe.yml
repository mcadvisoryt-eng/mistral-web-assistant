name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Ollama reachable + local chat
        run: |
          set +e
          URL=$(curl -sS -m 30 "https://raw.githubusercontent.com/mcadvisoryt-eng/mistral-web-assistant/gh-pages/endpoint.txt" | tr -d '\r\n')
          echo "endpoint: $URL"
          TOKEN=$(curl -sS -m 30 -H "Content-Type: application/json" \
            -d '{"email":"joshi@joshi.com","password":"joshi"}' "$URL/api/v1/auths/signin" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          echo "token length: ${#TOKEN}"
          echo "== /ollama/api/version =="
          curl -sS -m 25 -w "\n[%{http_code}]\n" -H "Authorization: Bearer $TOKEN" "$URL/ollama/api/version" | head -c 200
          echo
          echo "== /ollama/api/tags =="
          curl -sS -m 25 -H "Authorization: Bearer $TOKEN" "$URL/ollama/api/tags" | head -c 400
          echo
          echo "== model list (local ones) =="
          curl -sS -m 30 -H "Authorization: Bearer $TOKEN" "$URL/api/models" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('total:',len(d.get('data',[])));print([m.get('id') for m in d.get('data',[]) if any(t in m.get('id','').lower() for t in ('hermes','abliterated','dolphin','qwen3'))])"
          echo "== chat with the local model (CPU, may be slow) =="
          curl -sS -m 240 -o /tmp/c.json -w "http=%{http_code}\n" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d '{"model":"huihui_ai/deephermes3-abliterated:8b","messages":[{"role":"user","content":"Reply in one short sentence: what are you?"}],"stream":false}' \
            "$URL/api/chat/completions"
          python3 - <<'PY'
          import json
          raw = open('/tmp/c.json').read()
          try: d = json.loads(raw)
          except Exception: print("non-json:", raw[:300]); raise SystemExit
          if isinstance(d, list): print("list:", str(d)[:300]); raise SystemExit
          if d.get('error'): print("ERROR:", str(d['error'])[:300]); raise SystemExit
          ch = (d.get('choices') or [{}])[0]
          print("CONTENT:", str(ch.get('message', {}).get('content',''))[:400])
          PY
          echo "== done =="
