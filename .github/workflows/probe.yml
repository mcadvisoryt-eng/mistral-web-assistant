name: probe

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the stable redirect page and the live endpoint
        run: |
          set +e
          PAGES="https://mcadvisoryt-eng.github.io/mistral-web-assistant/"
          echo "== GET stable redirect page =="
          curl -sS -m 30 -o /tmp/pg.html -w "http=%{http_code} type=%{content_type} size=%{size_download}\n" "$PAGES"
          echo "target in page:"; grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/pg.html | head -1
          head -c 220 /tmp/pg.html; echo
          echo
          echo "== GET the live endpoint the page points at =="
          CF=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/pg.html | head -1)
          echo "CF url: $CF"
          curl -sS -m 30 -o /tmp/cf.html -w "http=%{http_code} type=%{content_type} size=%{size_download}\n" "$CF/"
          echo "title: $(grep -oE '<title>[^<]*</title>' /tmp/cf.html)"
          echo
          echo "== done =="
