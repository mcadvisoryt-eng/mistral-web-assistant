name: mistral-web-assistant

on:
  schedule:
    # every 5 hours, on the hour (UTC). GitHub may delay scheduled runs under load.
    - cron: "0 */5 * * *"
  workflow_dispatch: {}

concurrency:
  group: mistral-web-assistant
  cancel-in-progress: true

jobs:
  serve:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are hard-capped at 6h; stop just short of it.
    timeout-minutes: 350
    env:
      MODEL_REPO: bartowski/dolphin-2.9.3-mistral-7B-32k-GGUF
      MODEL_FILE: dolphin-2.9.3-mistral-7B-32k-Q4_K_M.gguf
      SEARCH_PROVIDER: tavily
      LLAMA_URL: http://127.0.0.1:8080
      APP_PORT: "8000"
      MAX_TOKENS: "256"

    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Install llama.cpp (prebuilt CPU build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgomp1
          mkdir -p llm
          # The rolling b#### releases carry the binaries; "latest" is a bare
          # version tag with none attached. Match only the plain CPU x64 build.
          curl -s -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=20" \
            -o llm/releases.json
          URL=$(grep -m1 -oE 'https://[^"]+/llama-[^"]*-bin-ubuntu-x64\.tar\.gz' llm/releases.json || true)
          if [ -z "$URL" ]; then echo "no llama.cpp ubuntu-x64 asset found"; exit 1; fi
          echo "Downloading: $URL"
          curl -L "$URL" -o llm/llama.tar.gz
          tar -xzf llm/llama.tar.gz -C llm
          BIN=$(find llm -type f -name llama-server | head -1)
          echo "LLAMA_SERVER=$BIN" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$BIN")" >> "$GITHUB_ENV"
          chmod +x "$BIN"
          echo "installed engine: $BIN"

      - name: Download uncensored Mistral 7B (Q4_K_M, ~4.4 GB)
        run: |
          pip install --quiet "huggingface_hub[cli]"
          python - <<'PY'
          import os
          from huggingface_hub import hf_hub_download
          hf_hub_download(
              repo_id=os.environ["MODEL_REPO"],
              filename=os.environ["MODEL_FILE"],
              local_dir="models",
          )
          PY
          ls -lh models

      - name: Install Python deps
        run: pip install --quiet fastapi "uvicorn[standard]" httpx

      - name: Install ngrok
        run: |
          curl -sSL https://ngrok-agent.s3.amazonaws.com/ngrok.asc \
            | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" \
            | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngrok
          ngrok version

      - name: Start llama-server (CPU, 4 threads)
        run: |
          nohup "$LLAMA_SERVER" -m "models/$MODEL_FILE" \
            --host 127.0.0.1 --port 8080 \
            -c 8192 -t 4 --threads-batch 4 \
            > llama.log 2>&1 &
          echo "llama-server started"

      - name: Start web-search wrapper
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          nohup python serve.py > app.log 2>&1 &
          echo "wrapper started"

      - name: Wait for the model to load
        run: |
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:8080/health >/dev/null; then
              echo "model ready"; break
            fi
            sleep 5
          done
          echo "---- llama.log ----"; tail -n 8 llama.log || true

      - name: Start ngrok tunnel and publish the URL
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          ngrok config add-authtoken "$NGROK_AUTHTOKEN"
          # No --url: ngrok uses this account's free static dev domain, so the
          # public URL is the same on every run. Read it from the agent's local API.
          ngrok http "$APP_PORT" --log stdout > ngrok.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            curl -s http://127.0.0.1:4040/api/tunnels -o tunnels.json || true
            URL=$(grep -m1 -oE '"public_url":"https://[^"]+"' tunnels.json | sed -E 's/.*"(https:[^"]+)"/\1/' || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          {
            echo "## Mistral web assistant is live"
            echo ""
            echo "**${URL}**"
            echo ""
            echo "Stable ngrok URL (your account's dev domain). Open it and chat."
            echo "Stays up until this job's ~6-hour timeout."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "URL=${URL}"
          if [ -z "$URL" ]; then echo "--- ngrok.log ---"; tail -n 30 ngrok.log || true; fi
          # keep the tunnel (and the job) alive for the rest of the window
          sleep 21000
