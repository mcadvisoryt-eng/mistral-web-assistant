name: mistral-web-assistant

on:
  schedule:
    # every 5 hours, on the hour (UTC). GitHub may delay scheduled runs under load.
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: "Gemini model id to pre-select in Open WebUI"
        required: false
        default: "models/gemini-3.6-flash"
      allow_missing_keys:
        description: "Dry run: don't fail if secrets are missing (no model)"
        type: boolean
        required: false
        default: false

concurrency:
  group: mistral-web-assistant
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  serve:
    runs-on: ubuntu-latest
    # GitHub-hosted jobs are hard-capped at 6h; stop just short of it.
    timeout-minutes: 350
    env:
      APP_PORT: "8000"
      # ntfy topic - keep it secret/unguessable, it doubles as the password.
      NTFY_TOPIC: "mcadvisoryt-mistral-9f2c7a"
      ADMIN_EMAIL: "joshi@joshi.com"
      # Override by adding a repo secret named ADMIN_PASSWORD (recommended, since
      # this repo is public and the default is a weak, known password).
      ADMIN_PASSWORD: "${{ secrets.ADMIN_PASSWORD || 'joshi' }}"
      ADMIN_NAME: "Joshi"
      # Gemini's OpenAI-compatible endpoint (no trailing slash!).
      GEMINI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/openai"
      DEFAULT_MODEL: "${{ github.event.inputs.model || 'models/gemini-3.6-flash' }}"

    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          [ -z "${{ secrets.GEMINI_API_KEY }}" ] && missing="$missing GEMINI_API_KEY"
          [ -z "${{ secrets.TAVILY_API_KEY }}" ] && missing="$missing TAVILY_API_KEY"
          if [ -n "$missing" ]; then
            if [ "${{ github.event.inputs.allow_missing_keys }}" = "true" ]; then
              echo "::warning::Missing secrets (allowed in dry-run mode):$missing"
            else
              echo "::error::Missing repository secrets:$missing"
              echo "Add them under Settings -> Secrets and variables -> Actions."
              exit 1
            fi
          fi
          echo "secret check done"

      - name: Verify Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then echo "no Gemini key - skipping verification"; exit 0; fi
          code=$(curl -s -o /tmp/models.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GEMINI_API_KEY}" "${GEMINI_BASE_URL}/models" || true)
          echo "Gemini /models HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Gemini key check failed (HTTP ${code})"
            head -c 400 /tmp/models.json || true
            exit 1
          fi
          python3 -c "import json;m=json.load(open('/tmp/models.json')).get('data',[]);print('available Gemini models:',len(m));print(', '.join(x.get('id','?') for x in m[:25]))"

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared
          ./cloudflared --version

      - name: Start Open WebUI (Docker, multi-provider)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          docker pull -q ghcr.io/open-webui/open-webui:main

          # Build the list of OpenAI-compatible connections. Gemini is always
          # first; the others are added only when their secret is present, so
          # the workflow still runs before you add the keys.
          BASES="${GEMINI_BASE_URL}"
          KEYS="${GEMINI_API_KEY}"
          if [ -n "${GROQ_API_KEY:-}" ]; then
            BASES="${BASES};https://api.groq.com/openai/v1"
            KEYS="${KEYS};${GROQ_API_KEY}"
          fi
          if [ -n "${OPENROUTER_API_KEY:-}" ]; then
            BASES="${BASES};https://openrouter.ai/api/v1"
            KEYS="${KEYS};${OPENROUTER_API_KEY}"
          fi
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            BASES="${BASES};https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/v1"
            KEYS="${KEYS};${CLOUDFLARE_API_TOKEN}"
          fi
          echo "OpenAI-compatible connections:"
          printf '%s\n' "$BASES" | tr ';' '\n'

          docker run -d --name open-webui \
            -p "${APP_PORT}:8080" \
            -e OPENAI_API_BASE_URLS="${BASES}" \
            -e OPENAI_API_KEYS="${KEYS}" \
            -e ENABLE_OPENAI_API=true \
            -e ENABLE_OLLAMA_API=false \
            -e WEBUI_ADMIN_EMAIL="${ADMIN_EMAIL}" \
            -e WEBUI_ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
            -e WEBUI_ADMIN_NAME="${ADMIN_NAME}" \
            -e WEBUI_NAME="Mistral Web Assistant" \
            -e WEBUI_SECRET_KEY=ephemeral-runner-secret \
            -e ENABLE_SIGNUP=false \
            -e AIOHTTP_CLIENT_TIMEOUT_MODEL_LIST=30 \
            -e DEFAULT_MODELS="${DEFAULT_MODEL}" \
            -e DEFAULT_PINNED_MODELS="${DEFAULT_MODEL}" \
            -e DEFAULT_MODEL_METADATA='{"capabilities":{"web_search":true,"citations":true,"status_updates":true},"defaultFeatureIds":["web_search"]}' \
            -e DEFAULT_MODEL_PARAMS='{"function_calling":"native"}' \
            -e ENABLE_WEB_SEARCH=true \
            -e WEB_SEARCH_ENGINE=tavily \
            -e WEB_SEARCH_RESULT_COUNT=5 \
            -e WEB_SEARCH_CONCURRENT_REQUESTS=3 \
            -e TAVILY_API_KEY="${TAVILY_API_KEY}" \
            -e BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL=true \
            -e USER_AGENT="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36" \
            -e ANONYMIZED_TELEMETRY=false \
            -e SCARF_NO_ANALYTICS=true \
            -e DO_NOT_TRACK=true \
            -e ENABLE_VERSION_UPDATE_CHECK=false \
            -e ENABLE_PERSISTENT_CONFIG=false \
            ghcr.io/open-webui/open-webui:main
          echo "open-webui container started"

      - name: Wait for Open WebUI to be ready
        run: |
          for i in $(seq 1 60); do
            if curl -sf "http://127.0.0.1:${APP_PORT}/health" >/dev/null; then
              echo "open-webui ready"; break
            fi
            sleep 5
          done
          docker ps --format '{{.Names}} | {{.Status}}'
          echo "---- open-webui logs ----"; docker logs --tail 20 open-webui || true

      - name: Enable web search on the default model (admin API)
        run: |
          set +e
          BASE="http://127.0.0.1:${APP_PORT}"
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -d "{\"email\":\"${ADMIN_EMAIL}\",\"password\":\"${ADMIN_PASSWORD}\"}" \
            "$BASE/api/v1/auths/signin" \
            | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))" 2>/dev/null)
          echo "admin token length: ${#TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::could not sign in to configure the model; web search stays off"
            exit 0
          fi
          # The DEFAULT_MODEL_METADATA env var is not applied when persistent config
          # is disabled, so set the model's meta explicitly: web_search capability,
          # web_search as a default feature, and native function calling.
          PAYLOAD=$(printf '{"id":"%s","base_model_id":"%s","name":"%s","meta":{"capabilities":{"web_search":true,"citations":true,"builtin_tools":true,"status_updates":true},"defaultFeatureIds":["web_search"]},"params":{"function_calling":"native"}}' \
            "$DEFAULT_MODEL" "$DEFAULT_MODEL" "$DEFAULT_MODEL")
          code=$(curl -s -o /tmp/mk.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "$PAYLOAD" "$BASE/api/v1/models/create")
          echo "model create HTTP $code"; head -c 300 /tmp/mk.json; echo
          if [ "$code" != "200" ]; then
            code=$(curl -s -o /tmp/up.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              -d "$PAYLOAD" "$BASE/api/v1/models/model/update?id=$DEFAULT_MODEL")
            echo "model update HTTP $code"; head -c 300 /tmp/up.json; echo
          fi

      - name: Start Cloudflare tunnel and verify it serves the app
        run: |
          # Cloudflare quick tunnels have no interstitial (unlike ngrok free),
          # so the app loads directly in a browser.
          nohup ./cloudflared tunnel --url "http://127.0.0.1:${APP_PORT}" --no-autoupdate > cf.log 2>&1 &
          disown 2>/dev/null || true
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' cf.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          printf '%s' "$URL" > url.txt
          echo "tunnel URL: $URL"

          ok=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${URL}/health" || true)
            echo "tunnel check $i -> HTTP ${code}"
            [ "$code" = "200" ] && { ok=1; break; }
            sleep 3
          done
          {
            echo "## Open WebUI is live"
            echo ""
            echo "**${URL}**"
            echo ""
            echo "Admin login: \`${ADMIN_EMAIL}\` / \`${ADMIN_PASSWORD}\`"
            echo ""
            echo "Tunnel verified: $([ -n "$ok" ] && echo yes || echo no)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$ok" ]; then
            echo "::error::Cloudflare tunnel is not serving ${URL}"
            echo "--- cf.log ---"; tail -n 40 cf.log || true
            exit 1
          fi

      - name: Publish endpoint to a tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s url.txt ]; then echo "no URL to publish"; exit 0; fi
          URL=$(cat url.txt)
          BODY=$(printf 'Open WebUI is live at %s\n\nLogin: `%s` / `%s`\n\n_Updated %s (run %s)._' \
            "$URL" "$ADMIN_EMAIL" "$ADMIN_PASSWORD" "$(date -u +%FT%TZ)" "${GITHUB_RUN_ID}")
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                --jq '.[] | select(.title=="Current endpoint") | .number' | head -1)
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --body "$BODY"
          else
            gh issue create --title "Current endpoint" --body "$BODY"
          fi
          echo "endpoint issue updated"

      - name: Point the stable redirect page at the live endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s url.txt ]; then echo "no URL to publish"; exit 0; fi
          URL=$(cat url.txt)
          # The stable page reads this file fresh on every load, so the redirect
          # target is always current (no Pages rebuild or browser-cache lag).
          printf '%s\n' "$URL" > endpoint.txt
          CONTENT=$(base64 -w0 endpoint.txt)
          FSHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/endpoint.txt?ref=gh-pages" --jq '.sha' 2>/dev/null || true)
          if [ -n "$FSHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/endpoint.txt" \
              -f message="endpoint -> ${URL}" -f branch=gh-pages -f content="$CONTENT" -f sha="$FSHA" >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/endpoint.txt" \
              -f message="endpoint -> ${URL}" -f branch=gh-pages -f content="$CONTENT" >/dev/null
          fi
          echo "stable redirect target updated -> ${URL}"

      - name: Notify start via ntfy
        run: |
          URL=$(cat url.txt 2>/dev/null || true)
          MSG=$(printf 'Open WebUI is up.\nURL: %s\nLogin: %s / %s' "$URL" "$ADMIN_EMAIL" "$ADMIN_PASSWORD")
          curl -s \
            -H "Title: Mistral web assistant started" \
            -H "Priority: default" \
            -H "Tags: robot" \
            -H "Click: ${URL}" \
            -d "$MSG" "https://ntfy.sh/${NTFY_TOPIC}" || true
          echo "start notification sent"

      - name: Keep the tunnel alive (health watchdog)
        run: |
          END=$(( $(date +%s) + 20000 ))
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 300
            if curl -sf "http://127.0.0.1:${APP_PORT}/health" >/dev/null; then
              echo "$(date -u +%T) healthy"
            else
              echo "$(date -u +%T) unhealthy - restarting open-webui"
              docker restart open-webui || true
              sleep 20
            fi
          done

      - name: Notify failure via ntfy
        if: failure()
        run: |
          curl -s \
            -H "Title: Mistral web assistant FAILED" \
            -H "Priority: high" \
            -H "Tags: warning" \
            -d "Run ${GITHUB_RUN_ID} failed. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
          echo "failure notification sent"
