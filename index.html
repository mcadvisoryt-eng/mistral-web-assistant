<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mistral Web Assistant</title>
<style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;padding:2rem;line-height:1.5}a{color:#58a6ff}</style>
</head>
<body>
<p id="msg">Redirecting to the live endpoint&hellip;</p>
<script>
// Read the current endpoint fresh on every load (no rebuild or cache lag).
const RAW = "https://raw.githubusercontent.com/mcadvisoryt-eng/mistral-web-assistant/gh-pages/endpoint.txt";
(async () => {
  const msg = document.getElementById("msg");
  try {
    const r = await fetch(RAW + "?t=" + Date.now(), {cache: "no-store"});
    if (r.ok) {
      const url = (await r.text()).trim();
      if (/^https?:\/\//.test(url)) { location.replace(url); return; }
    }
  } catch (e) {}
  msg.innerHTML = "No live endpoint right now. It comes up for ~6 hours after each run (every 5 hours) &mdash; try again shortly.";
})();
</script>
</body>
</html>
